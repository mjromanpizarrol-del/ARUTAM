<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARUTAM — Unlock the Secrets of Ancient Wisdom</title>
<meta name="description" content="Arutam: destilado premium amazónico de Ecuador. / Premium Amazonian spirit from Ecuador.">
<meta name="theme-color" content="#021E02">
<link rel="icon" type="image/png" href="img/favicon.png">
<meta property="og:title" content="ARUTAM — Unlock the Secrets of Ancient Wisdom">
<meta property="og:description" content="Destilado premium amazónico de Ecuador. / Premium Amazonian spirit from Ecuador.">
<meta property="og:image" content="img/selva-fondo.jpg">
<meta property="og:type" content="website">
<link rel="preload" href="fonts/TAN-SPRING.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="fern" viewBox="0 0 120 300"><path d="M60 300C58 200 60 100 60 0" stroke="currentColor" stroke-width="2" fill="none"/><g><ellipse cx="30.0" cy="260" rx="30.0" ry="8" transform="rotate(-30 60 260)"/><ellipse cx="90.0" cy="250" rx="30.0" ry="8" transform="rotate(30 60 250)"/><ellipse cx="32.5" cy="230" rx="27.5" ry="8" transform="rotate(-30 60 230)"/><ellipse cx="87.5" cy="220" rx="27.5" ry="8" transform="rotate(30 60 220)"/><ellipse cx="35.0" cy="200" rx="25.0" ry="8" transform="rotate(-30 60 200)"/><ellipse cx="85.0" cy="190" rx="25.0" ry="8" transform="rotate(30 60 190)"/><ellipse cx="37.5" cy="170" rx="22.5" ry="8" transform="rotate(-30 60 170)"/><ellipse cx="82.5" cy="160" rx="22.5" ry="8" transform="rotate(30 60 160)"/><ellipse cx="40.0" cy="140" rx="20.0" ry="8" transform="rotate(-30 60 140)"/><ellipse cx="80.0" cy="130" rx="20.0" ry="8" transform="rotate(30 60 130)"/><ellipse cx="42.5" cy="110" rx="17.5" ry="8" transform="rotate(-30 60 110)"/><ellipse cx="77.5" cy="100" rx="17.5" ry="8" transform="rotate(30 60 100)"/><ellipse cx="45.0" cy="80" rx="15.0" ry="8" transform="rotate(-30 60 80)"/><ellipse cx="75.0" cy="70" rx="15.0" ry="8" transform="rotate(30 60 70)"/><ellipse cx="47.5" cy="50" rx="12.5" ry="8" transform="rotate(-30 60 50)"/><ellipse cx="72.5" cy="40" rx="12.5" ry="8" transform="rotate(30 60 40)"/></g></symbol>
<symbol id="leaf" viewBox="0 0 100 100"><path d="M10 90C10 35 50 5 92 5C92 55 62 90 10 90Z"/></symbol>
</defs></svg>

<div class="progress" aria-hidden="true"><i id="bar"></i></div>
<div class="cursor" id="cursor" aria-hidden="true"><svg><use href="#leaf"/></svg></div>
<div class="curtain" id="curtain" aria-hidden="true">
  <svg class="cl cl-l"><use href="#fern"/></svg><svg class="cl cl-r"><use href="#fern"/></svg>
</div>

<header class="nav" id="nav">
  <a class="brand" href="#inicio" aria-label="ARUTAM"><img src="img/logo-arutam-claro.png" alt="ARUTAM"></a>
  <nav class="links" id="links" aria-label="Principal">
    <a href="#inicio" data-g="inicio" data-i18n="nav.inicio"></a>
    <a href="#nosotros" data-g="nosotros" data-i18n="nav.nosotros"></a>
    <a href="#productos" data-g="productos" data-i18n="nav.productos"></a>
    <a href="#contacto" data-g="contacto" data-i18n="nav.contacto"></a>
  </nav>
  <button class="lang" id="lang" type="button" aria-label="Cambiar idioma / Change language"><span id="lang-es">ES</span><span class="sep">·</span><span id="lang-en">EN</span></button>
  <button class="burger" id="burger" type="button" aria-label="Menú" aria-expanded="false"><i></i><i></i></button>
</header>

<main>
<section id="inicio" class="hero dark">
  <div class="hero-bg" id="heroBg"></div><div class="hero-light" id="heroLight"></div>
  <svg class="leaf" data-depth=".30" style="--r:18deg;left:-90px;top:14%;width:clamp(150px,22vw,320px);height:clamp(380px,56vw,800px)"><use href="#fern"/></svg>
  <svg class="leaf" data-depth=".22" style="--r:-22deg;--fx:-1;right:-90px;top:8%;width:clamp(150px,22vw,320px);height:clamp(380px,56vw,800px)"><use href="#fern"/></svg>
  <div class="hero-in">
    <img class="hero-logo" src="img/logo-arutam-claro.png" alt="ARUTAM">
    <p class="kick" data-i18n="hero.kicker"></p>
    <h1 data-i18n="hero.title"></h1>
    <p class="lead" data-i18n="hero.text"></p>
    <div class="cta"><a class="btn solid" href="#productos" data-i18n="hero.cta1"></a><a class="btn" href="#contacto" data-i18n="hero.cta2"></a></div>
  </div>
  <a class="scroll" href="#nosotros"><span data-i18n="hero.scroll"></span><i></i></a>
</section>


<section id="nosotros" class="light">
  <svg class="leaf" data-depth=".2" style="--r:150deg;right:-60px;top:-40px;width:clamp(120px,18vw,260px);height:clamp(300px,45vw,650px);color:#4C6E52;opacity:.35"><use href="#fern"/></svg>
  <div class="wrap">
    <p class="kick" data-i18n="about.kicker"></p>
    <h2 class="narrow" data-i18n="about.title"></h2>
    <div class="about-grid">
      <div class="about-text">
        <h3 data-i18n="about.mission"></h3><p data-i18n="about.missionT"></p>
        <h3 data-i18n="about.vision"></h3><p data-i18n="about.visionT"></p>
      </div>
      <div class="arch ph" data-ph="[img/foto-selva.jpg]" style="--a:#4C6E52;--b:#021E02"><img src="img/foto-selva.jpg" alt="" data-opt></div>
      <div class="arch ph lower" data-ph="[img/foto-ritual.jpg]" style="--a:#B68A3A;--b:#4C2204"><img src="img/foto-ritual.jpg" alt="" data-opt></div>
    </div>
    <ul class="values"><li data-i18n="v.1"></li><li data-i18n="v.2"></li><li data-i18n="v.3"></li><li data-i18n="v.4"></li><li data-i18n="v.5"></li></ul>
    <p class="essence" data-i18n="about.essence"></p>
  </div>
</section>


<section id="origen" class="dark">
  <svg class="leaf" data-depth=".25" style="--r:25deg;left:-80px;bottom:-60px;width:clamp(140px,20vw,300px);height:clamp(350px,50vw,750px)"><use href="#fern"/></svg>
  <svg class="leaf" data-depth=".18" style="--r:-30deg;--fx:-1;right:-70px;bottom:-80px;width:clamp(140px,20vw,300px);height:clamp(350px,50vw,750px)"><use href="#fern"/></svg>
  <div class="wrap">
    <p class="kick" data-i18n="origin.kicker"></p>
    <h2 class="narrow" data-i18n="origin.title"></h2>
    <p class="lead" data-i18n="origin.text"></p>
    <div class="doors" id="doors">
      <button class="door arch" type="button" aria-expanded="false" style="--a:#4C6E52;--b:#021E02;--img:url('../img/door-ayahuasca.jpg')"><b>Ayahuasca</b><span data-i18n="door.aya"></span></button>
      <button class="door arch tall" type="button" aria-expanded="false" style="--a:#B68A3A;--b:#4C2204;--img:url('../img/door-guayusa.jpg')"><b>Guayusa</b><span data-i18n="door.gua"></span></button>
      <button class="door arch" type="button" aria-expanded="false" style="--a:#916132;--b:#1D0F0A;--img:url('../img/door-cacao.jpg')"><b>Cacao</b><span data-i18n="door.cac"></span></button>
    </div>
  </div>
</section>


<section id="productos" class="dark tex">
  <div class="wrap">
    <p class="kick" data-i18n="prod.kicker"></p>
    <h2 class="narrow" data-i18n="prod.title"></h2>
    <div class="cards" id="cards"></div>
  </div>
</section>


<section id="fichas" class="ficha">
  <div class="f-bg" data-p="aya"></div><div class="f-bg" data-p="gua"></div><div class="f-bg" data-p="cac"></div>
  <svg class="leaf" data-depth=".25" style="--r:-22deg;--fx:-1;right:-80px;top:6%;width:clamp(140px,20vw,300px);height:clamp(350px,50vw,750px)"><use href="#fern"/></svg>
  <svg class="leaf" data-depth=".2" style="--r:20deg;left:-80px;bottom:-5%;width:clamp(140px,20vw,300px);height:clamp(350px,50vw,750px)"><use href="#fern"/></svg>
  <div class="wrap">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="f-main">
      <div class="f-text">
        <p class="kick" id="f-tag"></p>
        <h2 id="f-name"></h2>
        <h3 data-i18n="f.look"></h3><p id="f-look"></p>
        <h3 data-i18n="f.taste"></h3><p id="f-taste"></p>
        <h3 data-i18n="f.serve"></h3><p id="f-serve"></p>
      </div>
      <div class="arch bottle ph" id="f-bottle" data-ph="[botella]" style="--a:rgba(215,214,219,.14);--b:rgba(2,30,2,.2)"><img id="f-img" src="" alt="" data-opt></div>
    </div>
    <h3 class="cock-title" data-i18n="f.cocktails"></h3>
    <div class="cocks" id="cocks"></div>
    <button class="next" id="next" type="button"><span data-i18n="f.next"></span> <b id="next-name"></b></button>
  </div>
</section>


<section class="quote dark tex"><blockquote data-i18n="q.text"></blockquote></section>


<section id="trade" class="dark">
  <div class="wrap">
    <p class="kick" data-i18n="trade.kicker"></p>
    <h2 class="narrow" data-i18n="trade.title"></h2>
    <div class="trade-grid">
      <article><h3 data-i18n="trade.1t"></h3><p data-i18n="trade.1p"></p></article>
      <article><h3 data-i18n="trade.2t"></h3><p data-i18n="trade.2p"></p></article>
      <article><h3 data-i18n="trade.3t"></h3><p data-i18n="trade.3p"></p></article>
    </div>
    <div class="horeca"><h3 data-i18n="horeca.t"></h3><p data-i18n="horeca.p"></p><a class="btn solid" href="#contacto" data-i18n="horeca.btn"></a></div>
  </div>
</section>


<section id="contacto" class="light">
  <svg class="leaf" data-depth=".2" style="--r:-20deg;--fx:-1;right:-70px;bottom:-60px;width:clamp(120px,18vw,280px);height:clamp(300px,45vw,700px);color:#4C6E52;opacity:.4"><use href="#fern"/></svg>
  <div class="wrap">
    <p class="kick" data-i18n="contact.kicker"></p>
    <h2 class="narrow" data-i18n="contact.title"></h2>
    <div class="contact-grid">
      <form id="form" novalidate>
        <label><span data-i18n="c.name"></span><input name="name" required autocomplete="name"></label>
        <label><span data-i18n="c.venue"></span><input name="venue" autocomplete="organization"></label>
        <label><span data-i18n="c.email"></span><input name="email" type="email" required autocomplete="email"></label>
        <label><span data-i18n="c.msg"></span><textarea name="msg" rows="4" required></textarea></label>
        <button class="btn solid-d" type="submit" data-i18n="c.send"></button>
        <p class="note" id="form-note" role="status"></p>
      </form>
      <div class="direct">
        <h3 data-i18n="c.direct"></h3>
        <dl>
          <dt data-i18n="c.who"></dt><dd>Andrés Eguiguren</dd>
          <dt data-i18n="c.company"></dt><dd>Ruray SAS — ARUTAM Spirits</dd>
          <dt data-i18n="c.phone"></dt><dd><a href="tel:+593993358952">+593 99 335 8952</a></dd>
          <dt>Email</dt><dd><a href="mailto:aeguiguren@arutamspirits.com">aeguiguren@arutamspirits.com</a></dd>
          <dt data-i18n="c.origin"></dt><dd>Quito, Ecuador</dd>
        </dl>
      </div>
    </div>
  </div>
</section>
</main>

<footer class="dark foot">
  <img src="img/logo-arutam-claro.png" alt="ARUTAM">
  <div><p data-i18n="foot.tag"></p><p class="legal" data-i18n="foot.legal"></p></div>
</footer>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
